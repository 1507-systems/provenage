[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "provenage-meeting-ics"
version = "0.1.0"
description = "Source-agnostic civic meeting records to an RFC 5545 iCalendar feed. Standard library only."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bryce Shashinka" }]
keywords = ["icalendar", "ics", "civic", "government", "meetings", "rfc5545"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/1507-systems/provenage"
Source = "https://github.com/1507-systems/provenage/tree/main/packages/meeting-ics"
Issues = "https://github.com/1507-systems/provenage/issues"
Changelog = "https://github.com/1507-systems/provenage/releases"

[project.scripts]
meeting-ics = "meeting_ics.cli:main"

[tool.setuptools.packages.find]
include = ["meeting_ics*"]

[tool.setuptools.package-data]
meeting_ics = ["py.typed"]
