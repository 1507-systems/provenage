[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provenage-meeting-ics"
version = "0.1.0"
description = "Source-agnostic civic meeting records to an RFC 5545 iCalendar feed. Standard library only."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
meeting-ics = "meeting_ics.cli:main"

[tool.setuptools.packages.find]
include = ["meeting_ics*"]
