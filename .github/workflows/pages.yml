# Publishes the static builder page (site/) to GitHub Pages.
# Only the page files are uploaded, assembled into a clean folder; never the whole site/ directory
# (it also holds package.json, the lockfile, Playwright config and test fixtures) and never the repo root.
# No secrets are used. All action refs are pinned to commit SHAs.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Assemble page files
        run: |
          set -eu
          mkdir -p _pages
          for f in index.html app.js canon.js style.css .nojekyll; do
            cp "site/$f" "_pages/$f"
          done
          ls -A _pages

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
