# CI for the repository: Python package (packages/meeting-ics) and the feeds Worker (workers/feeds).
# Validation only: no deploy steps. One job named "ci" is the required status check.
# Lint runs before test so a ruff failure never masks a test failure.
# All action refs are pinned to commit SHAs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dev tools
        # The package has no runtime dependencies, so there is no requirements.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (before test)
        run: ruff check packages/

      - name: Test (Python)
        # Zero collected tests exits 5 and fails this step. Keep it that way.
        run: pytest packages/meeting-ics

      - name: Audit (Python)
        run: pip-audit -r requirements-dev.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/feeds/package-lock.json

      - name: Install (Worker, exact from lockfile)
        working-directory: workers/feeds
        run: npm ci

      - name: Typecheck (Worker)
        working-directory: workers/feeds
        run: npx tsc --noEmit

      - name: Test (Worker)
        working-directory: workers/feeds
        run: npm test

      - name: Build check (Worker, no side effects)
        working-directory: workers/feeds
        run: npx wrangler deploy --dry-run

      - name: Audit (Worker, final gate)
        working-directory: workers/feeds
        run: npm audit --audit-level=high
