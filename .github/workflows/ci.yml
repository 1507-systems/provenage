# CI for the repository: Python package (packages/meeting-ics) and the feeds Worker (workers/feeds).
# Validation only: no deploy steps. One job named "ci" is the required status check.
# Lint runs before test so a ruff failure never masks a test failure.
# All action refs are pinned to commit SHAs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dev tools
        # The package has no runtime dependencies, so there is no requirements.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (before test)
        run: ruff check packages/ workers/feeds/scripts/

      - name: Test (Python)
        # Zero collected tests exits 5 and fails this step. Keep it that way.
        # workers/feeds/scripts holds the publisher tests; they use an in-memory store and make no network calls.
        run: pytest packages/meeting-ics workers/feeds/scripts

      - name: Audit (Python)
        run: pip-audit -r requirements-dev.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/feeds/package-lock.json

      - name: Install (Worker, exact from lockfile)
        working-directory: workers/feeds
        run: npm ci

      - name: Test (page, Node-only unit tests)
        # No dependencies needed: node --test only. The browser tests run in the separate "site" job.
        working-directory: site
        run: node --test test/unit/*.test.mjs

      - name: Typecheck (Worker)
        working-directory: workers/feeds
        run: npx tsc --noEmit

      - name: Test (Worker)
        working-directory: workers/feeds
        run: npm test

      - name: Check /mix/ fixtures match the real builder
        # Fixtures are synthetic and generated by the real builder (workers/feeds/scripts/gen_mix_fixtures.py).
        run: |
          PYTHONPATH=packages/meeting-ics python workers/feeds/scripts/gen_mix_fixtures.py "$RUNNER_TEMP/mix-fixtures"
          diff -r "$RUNNER_TEMP/mix-fixtures" workers/feeds/test/fixtures

      - name: Validate merged /mix/ outputs with check-feed
        # The Worker tests write each merged calendar to MIX_OUT_DIR; the Python validator then checks every one.
        working-directory: workers/feeds
        env:
          MIX_OUT_DIR: ${{ runner.temp }}/mix-out
          PYTHONPATH: ${{ github.workspace }}/packages/meeting-ics
        run: |
          npx vitest run test/mix.test.ts
          n=0
          for f in "$MIX_OUT_DIR"/*.ics; do
            python -m meeting_ics check-feed "$f"
            n=$((n + 1))
          done
          test "$n" -ge 7

      - name: Test (publisher against wrangler's local R2 simulator)
        # --local only: no account, no token, no network. State goes to a temporary directory.
        env:
          PROVENAGE_WRANGLER_LOCAL: '1'
          WRANGLER_SEND_METRICS: 'false'
        run: python -m pytest workers/feeds/scripts -q -k WranglerLocal

      - name: Build check (Worker, no side effects)
        working-directory: workers/feeds
        run: npx wrangler deploy --dry-run

      - name: Audit (Worker, final gate)
        working-directory: workers/feeds
        run: npm audit --audit-level=high

  site:
    # Validation only: tests the static builder page (site/) in headless Chromium. Deploys nothing.
    # Pinned to ubuntu-latest because Playwright needs the OS libraries installed with --with-deps (sudo).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install (page tests, exact from lockfile)
        working-directory: site
        run: npm ci

      - name: Unit tests (grammar vectors shared with the Worker, banned APIs, CSP text)
        working-directory: site
        run: npm run test:unit

      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Browser tests (axe accessibility, 320 px width, CSP, XSS, states)
        working-directory: site
        run: npm run test:e2e

      - name: Audit (page tests)
        working-directory: site
        run: npm audit --audit-level=high
